[project]
name = "doppi-payments-bot"
version = "0.1.0"
description = "Telegram bot and Web App: what each worker earned for Döppi recordings, and the cash handed from leads to staff to workers"
requires-python = ">=3.12"
dependencies = [
    # backend: database and API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "openpyxl>=3.1.5",
    "aiosmtplib>=3.0",
    "httpx>=0.27",
    # bot
    "python-telegram-bot[webhooks]>=21.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv]
package = false
